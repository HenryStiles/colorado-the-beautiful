<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colorado is Beautiful | Interactive Photo Gallery</title>
  <meta name="description" content="Explore Colorado's most majestic natural landmarks. An interactive photo gallery highlighting beautiful places in Colorado, shared in honor of Colorado's 150th anniversary. Click to flip for details.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Ambient glowing backgrounds for modern look -->
  <div class="ambient-glow-1"></div>
  <div class="ambient-glow-2"></div>

  <div class="container">
    <!-- Header Section -->
    <header>
      <div class="logo">
        <span class="logo-tagline">Colorado's 150th Anniversary</span>
        <h1>Colorado is Beautiful</h1>
      </div>
      <p class="subtitle">A photo gallery of the places we love, shared in honor of Colorado's 150th anniversary. We've collected 150 photos to celebrate the Centennial State. Click any card to read their stories.</p>
    </header>

    <!-- Embedded Gallery iFrame -->
    <main class="iframe-section">
      <iframe 
        id="gallery-iframe" 
        src="gallery.html" 
        title="Colorado is Beautiful Photo Gallery" 
        style="width: 100%; border: none; overflow: hidden; display: block; min-height: 600px;" 
        scrolling="no">
      </iframe>
    </main>

    <!-- Footer -->
    <footer>
      <p class="footer-logo">Colorado is Beautiful</p>
    </footer>
  </div>

  <script>
    // Listen for resize messages from gallery.html iframe
    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'resize-iframe') {
        const iframe = document.getElementById('gallery-iframe');
        if (iframe) {
          iframe.style.height = (event.data.height + 20) + 'px';
        }
      }
    });
  </script>
</body>
</html>
